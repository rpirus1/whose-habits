<svg xmlns="http://www.w3.org/2000/svg" width="160" height="96" viewBox="0 0 160 96">
<style>
  /* Plain CSS animation: works when shown as an image, no script. Still when the phone asks for less motion. */
  .bob { animation: bob 3.2s ease-in-out infinite; }
  .late { animation-delay: -1.6s; }
  .link { animation: flow 1.2s linear infinite; }
  .qr { animation: scan 3.2s ease-in-out infinite; }
  .dot { transform-box: fill-box; transform-origin: center; animation: pop 3.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes flow { to { stroke-dashoffset: -7; } }
  @keyframes scan { 0%, 100% { opacity: 1; } 50% { opacity: .75; } }
  @keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
