<path d="M68 20h24v6a12 12 0 0 1-24 0Z" fill="#fdca3a"/>
<path d="M68 23h-5a5 5 0 0 0 5 7M92 23h5a5 5 0 0 1-5 7" stroke="#fdca3a" stroke-width="2.5" fill="none"/>
<rect x="78" y="37" width="4" height="6" fill="#fdca3a"/>
<rect x="72" y="42" width="16" height="4" rx="2" fill="#fdca3a"/>
</g>
