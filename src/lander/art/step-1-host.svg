<svg xmlns="http://www.w3.org/2000/svg" width="160" height="96" viewBox="0 0 160 96">
<style>
  /* Plain CSS animation: works when shown as an image, no script. Still when the phone asks for less motion. */
  * { transform-box: fill-box; transform-origin: center; }
  .row { animation: row 4.8s ease-in-out infinite both; }
  .r2 { animation-delay: .25s; }
  .r3 { animation-delay: .5s; }
  .fill { stroke-dasharray: 26; animation: fill 4.8s ease-in-out infinite; }
  .cta { animation: cta 4.8s ease-in-out infinite; }
  .spark { animation: spark 2.4s ease-in-out infinite; }
  .s2 { animation-delay: .8s; }
  .s3 { animation-delay: 1.6s; }
  @keyframes row { 0%, 8% { opacity: 0; transform: translateX(-4px); } 20%, 88% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  @keyframes fill { 0%, 25% { stroke-dashoffset: 20; } 55%, 100% { stroke-dashoffset: 0; } }
  @keyframes cta { 0%, 62% { transform: none; } 70% { transform: scale(.92); } 78%, 100% { transform: none; } }
  @keyframes spark { 0%, 100% { transform: scale(.6) rotate(0); opacity: .5; } 50% { transform: scale(1.1) rotate(45deg); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
