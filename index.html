<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090504" />
    <!-- Apply the saved or system theme before the first paint, so there's no flash.
         Same key and values as src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('cc:theme')
        var dark =
          t === 'dark' || (t !== 'light' && !matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        if (!dark)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fcf3f0')
      } catch (e) {}
    </script>
    <title>Whose Habits: a free party game for international friends</title>
    <meta
      name="description"
      content="Guess which country an everyday habit comes from. A free culture quiz for expat game nights and international friends. No app, no sign-up, one phone each."
    />

    <!-- Link previews (WhatsApp, iMessage, Telegram, LinkedIn). og:url and og:image must be
         absolute: they come from VITE_SITE_URL in .env (switch it once the domain is connected). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Whose Habits" />
    <meta property="og:title" content="Whose Habits: guess whose habit it is" />
    <meta
      property="og:description"
      content="A party game about the little habits that make every country feel like home. No app, no sign-up, just your phones."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Whose Habits: a statement card with six country flags to choose from."
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Whose Habits: guess whose habit it is" />
    <meta
      name="twitter:description"
      content="A party game about the little habits that make every country feel like home. No app, no sign-up, just your phones."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
