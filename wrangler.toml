# Cloudflare Pages project: static site from dist/ plus Functions in functions/.
name = "culture-clash"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "culture-clash"
# Placeholder for local development. Step 8 replaces it with the id from
# `npx wrangler d1 create culture-clash`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
