# Cloudflare Worker: the built app (dist/) as static assets plus the /api/event route.
name = "culture-clash"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Unknown paths like /r/<room> get index.html so the React router can handle them.
not_found_handling = "single-page-application"
# API calls go to the Worker before the assets layer looks at them.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "culture-clash"
database_id = "373adea5-17c9-4098-99b4-9f0917a4b076"
migrations_dir = "migrations"
