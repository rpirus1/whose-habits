# Cloudflare Worker: the built app (dist/) as static assets plus the /api/event route.
name = "culture-clash"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# index.html is the prerendered landing page, so it can't be the SPA fallback. Paths that
# match no file (/new, /r/<room>, unknown pages) go to the Worker, which serves app.html.
not_found_handling = "none"
# API calls and the stats page go to the Worker before the assets layer looks at them.
run_worker_first = ["/api/*", "/stats"]

# The stats page bundles scripts/metrics.sql as text, so it runs the same queries as `npm run metrics`.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "culture-clash"
database_id = "373adea5-17c9-4098-99b4-9f0917a4b076"
migrations_dir = "migrations"

# Rate limits per IP address (worker/rateLimit.ts). A party of 12 phones behind one Wi-Fi
# sends a handful of events per game, far below this; a script flooding D1 is cut off.
[[ratelimits]]
name = "EVENT_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# /stats password attempts: slows down guessing STATS_TOKEN.
[[ratelimits]]
name = "STATS_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
