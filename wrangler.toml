# Cloudflare Worker: the built app (dist/) as static assets plus the /api/event route.
name = "culture-clash"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

# The public address. Both domains are attached to this Worker (Cloudflare creates their DNS
# records); the Worker sends whosehabits.com and the workers.dev address to www with a 301
# (canonicalRedirect in worker/routes.ts).
routes = [
  { pattern = "www.whosehabits.com", custom_domain = true },
  { pattern = "whosehabits.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
# index.html is the prerendered landing page, so it can't be the SPA fallback. Paths that
# match no file (/new, /r/<room>, unknown pages) go to the Worker, which serves app.html.
not_found_handling = "none"
# Every request reaches the Worker first, so old addresses can redirect; it then serves the
# file from the assets binding, or the app shell when there is none.
# (The stats page is a separate private Worker: stats/wrangler.toml.)
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "culture-clash"
database_id = "373adea5-17c9-4098-99b4-9f0917a4b076"
migrations_dir = "migrations"

# Rate limits per IP address (worker/rateLimit.ts). A party of 12 phones behind one Wi-Fi
# sends a handful of events per game, far below this; a script flooding D1 is cut off.
[[ratelimits]]
name = "EVENT_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Workers Logs, to catch errors: kept 3 days on the free plan (7 on paid). Every request reaches
# this Worker (run_worker_first), so every request to the site is logged, the lander included.
# Set here, not only in the dashboard, so a deploy from main can't switch it off.
# The lander's privacy section mentions these logs: keep the two in step.
[observability.logs]
enabled = true
invocation_logs = true
